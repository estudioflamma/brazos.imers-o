<style>
/* VOICE: workshop de imersão do Estúdio FLAMMA, caloroso e preciso
   IDEA: um board de Figma com frames, post-its e dinâmicas
   PICTURE: capa vermelha com o lettering FLAMMA e o roteiro das 7 etapas
   COLOUR/TYPE: marrom #3F0C0C, vermelho #CE1515, off-white #FBEFE0; Instrument Serif (títulos), Rethink Sans (texto), Roboto Mono (subtítulos)
   LAYOUT: canvas marrom, frames off-white arredondados empilhados, cards de pergunta em grade */
:root{
  --brown:#3F0C0C; --red:#CE1515; --off:#FBEFE0; --card:#FFF8EF; --line:rgba(63,12,12,.14); --soft:rgba(63,12,12,.62);
  --pr:#F6DA9B; --pd:#CFDDB8; --pf:#F3B3A6; --pr-k:#B8871C; --pd-k:#5E7A36; --pf-k:#CE1515;
  --serif:"Instrument Serif", Georgia, "Times New Roman", serif;
  --sans:"Rethink Sans", "Helvetica Neue", Arial, sans-serif;
  --mono:"Roboto Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--off);color:var(--brown);font:16px/1.5 var(--sans);overflow-x:clip;padding-inline:16px;padding-block:0}

/* barra */
.bar{position:sticky;top:0;z-index:20;margin-inline:-16px;background:var(--brown);color:var(--off);padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;border-bottom:1px solid rgba(251,239,224,.14)}
.bar .logo{width:92px;color:var(--off)}
.bar .proj{font-size:13px;opacity:.75;margin-right:auto}
.pens{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pens span{font-size:12px;opacity:.65}
.pen{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid rgba(251,239,224,.22);min-height:36px}

function notesArea(id,blank=2){
  const wrap=h("div",{class:"notes"});
  const list=()=>S.notes[id]||(S.notes[id]=Array.from({length:blank},()=>({t:""})));
  const render=focus=>{
    wrap.innerHTML="";
    const arr=S.notes[id]||Array.from({length:blank},()=>({t:""}));
    arr.forEach((n,i)=>{
      const txt=h("div",{class:"txt",contenteditable:"true",spellcheck:"true","aria-label":"Post-it"});txt.textContent=n.t;
      txt.addEventListener("input",()=>{list()[i].t=txt.innerText;save()});
      const del=h("button",{class:"del","aria-label":"Apagar post-it",onclick:()=>{list().splice(i,1);save();render()}},"×");
      wrap.append(h("div",{class:"note"},del,txt));
    });
    if(focus){const all=wrap.querySelectorAll(".txt");all[all.length-1]?.focus()}
  };
  render();
  return [wrap,h("button",{class:"add",onclick:()=>{list().push({t:""});save();render(true)}},"+ post-it")];
}
function examples(ex,label="Exemplos"){return h("div",{class:"ex"},h("p",null,label),h("div",{class:"exs"},ex.map(t=>h("div",{class:"exn"},t))))}
function qCard(it,id){
  const card=h("div",{class:"q"+(it.wide?" wide":"")});
  card.append(h("div",{class:"qh"},h("span",{class:"qn"+(it.tag?" tag":"")},it.n||it.tag||"✎"),h("div",null,h("strong",null,it.q),it.sub?h("small",null,it.sub):null)));
  if(it.table){const th=it.thead||["Atributo funcional","Atributo emocional"];card.append(h("div",{class:"ex",style:"overflow-x:auto"},h("p",null,"Exemplos"),h("table",{class:"attr"},h("thead",null,h("tr",null,th.map(t=>h("th",null,t)))),h("tbody",null,it.table.map(r=>h("tr",null,r.map((c,k)=>h("td",{class:k===0&&th.length>2?"lbl":""},c))))))))}
  else if(it.ex)card.append(examples(it.ex,it.exLabel));

/* ---------- chips por caneta ---------- */
const SYM={y:"✓",n:"✕",star:"★"};
function chip(gid,opt,states){
  const [label,ex]=opt.split("|");
  const mark=h("span",{class:"mk"});
  const b=h("button",{class:"chip"},h("span",null,label,ex?h("em",null," · "+ex):null),mark);
  const paint=()=>{
    const s=(S.chips[gid]||{})[label];
    mark.textContent=s?SYM[s]:"";mark.hidden=!s;
    b.classList.toggle("on",!!s&&s!=="n");b.classList.toggle("no",s==="n");
    b.setAttribute("aria-pressed",String(!!s));
  };
  b.addEventListener("click",()=>{
    const g=S.chips[gid]||(S.chips[gid]={}),i=g[label]?states.indexOf(g[label]):-1;
    if(i+1<states.length)g[label]=states[i+1];else delete g[label];
    save();paint();
  });
  paint();return b;
}
function legend(states){
  const txt={y:"✓ escolhido",n:"✕ rejeitado",star:"★ principal"};
  return h("div",{class:"legend"},states.map(s=>h("span",null,txt[s])),h("span",null,"Clique de novo para desmarcar"));
}
function group(g){
  const el=h("div",{class:"grp"},g.label?h("h4",null,g.label,g.sub?h("small",null,g.sub):null):null,h("div",{class:"chips"},g.opts.map(o=>chip(g.id,o,g.states))));

  if(g.after)el.append(qCard({q:g.after.q,cols:g.after.cols,wide:true},g.after.id));

}
function dynBox(d){
  const st=[...new Set(d.groups.flatMap(g=>g.states).concat(d.tail?d.tail.states:[]))];

function spectrum(){

    i.value=S.scales[j]||3;i.addEventListener("input",()=>{S.scales[j]=+i.value;save();upd(+i.value)});
    upd(+i.value);

  });

function refSlot(id,kind){
  const r=S.refs[id]||{};
  const img=h("div",{class:"img",tabindex:"0",role:"button","aria-label":"Adicionar imagem"},"Clique, cole ou arraste uma imagem");
  const x=h("span",{class:"x"},"remover");img.append(x);
  const file=h("input",{type:"file",accept:"image/*",class:"sr",id:"f-"+id,tabindex:"-1"});
  const fld=(key,cls,ph)=>{const f=h("div",{class:"fld "+cls,contenteditable:"true","data-ph":ph});f.textContent=r[key]||"";f.addEventListener("input",()=>{(S.refs[id]=S.refs[id]||{})[key]=f.innerText;save()});return f};
  const show=()=>{const s=S.refs[id];if(s&&s.i){img.style.backgroundImage=`url(${s.i})`;img.classList.add("has")}else{img.style.backgroundImage="";img.classList.remove("has")}};
  const take=f=>{if(!f||!f.type.startsWith("image/"))return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const m=560,sc=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*sc;c.height=im.height*sc;c.getContext("2d").drawImage(im,0,0,c.width,c.height);(S.refs[id]=S.refs[id]||{}).i=c.toDataURL("image/jpeg",.8);save();show()};im.src=fr.result};fr.readAsDataURL(f)};
  img.addEventListener("click",e=>{if(e.target===x){S.refs[id].i=null;save();show();return}file.click()});
  img.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();file.click()}});
  img.addEventListener("paste",e=>{const it=[...e.clipboardData.items].find(i=>i.type.startsWith("image/"));if(it){e.preventDefault();take(it.getAsFile())}});
  img.addEventListener("dragover",e=>{e.preventDefault();img.classList.add("drag")});
  img.addEventListener("dragleave",()=>img.classList.remove("drag"));
  img.addEventListener("drop",e=>{e.preventDefault();img.classList.remove("drag");take(e.dataTransfer.files[0])});
  file.addEventListener("change",()=>take(file.files[0]));
  show();
  return h("div",{class:"slot"+(kind==="anti"?" anti":"")},img,file,fld("n","nm","Marca"),fld("w","",kind==="anti"?"O que gera rejeição?":"O que gostaríamos de trazer?"));
}

let tLeft=0,tName="",tRun=null;

function exportText(){
  const L=["IMERSÃO DE MARCA · BRAZOS · Estúdio FLAMMA®",""];
  const notes=(id,title)=>{const n=(S.notes[id]||[]).filter(x=>x.t.trim());if(!n.length)return;if(title)L.push("• "+title);n.forEach(x=>L.push(`   - ${x.t.trim()}`))};
  const q=(it,id)=>{if(it.cols){const has=it.cols.some((c,k)=>(S.notes[id+"-"+k]||[]).some(x=>x.t.trim()));if(!has)return;L.push("• "+it.q);it.cols.forEach((c,k)=>notes(id+"-"+k,"  "+c))}else notes(id,it.q)};
  const NAME={y:"escolhido",n:"rejeitado",star:"principal"};
  const chips=gid=>{const g=S.chips[gid]||{};["star","y","n"].forEach(st=>{const o=Object.keys(g).filter(k=>g[k]===st);if(o.length)L.push(`   ${SYM[st]} ${NAME[st]}: ${o.join(", ")}`)})};
  const grp=g=>{if(g.label)L.push("  "+g.label);chips(g.id);if(g.after)q(g.after,g.after.id)};
  STEPS.forEach(s=>{L.push("",`## ${s.n} · ${s.name}`);
    s.items.forEach(it=>{
      if(!it.dyn)return it.noNotes?null:q(it,"q"+(it.id||it.n));
      const d=DYN[it.dyn];
      if(d){L.push("• "+(d.n?d.n+" · ":"")+d.title);d.groups.forEach(grp);
        if(d.refs)Object.entries(S.refs).forEach(([k,v])=>{if((v.n||"").trim()||(v.w||"").trim())L.push(`   ${k.startsWith("neg")?"Rejeitamos":"Admiramos pela identidade visual"}: ${(v.n||"").trim()} · ${(v.w||"").trim()}`)});
        if(d.msgs){L.push("  Uma mensagem, diferentes personalidades");chips("msg")}
        if(d.tail)grp(d.tail);
        if(d.after)q(d.after,d.after.id)}
      if(it.dyn==="espectro"){L.push("• Espectro de personalidade (1 a 5)");SPEC.forEach(([a,b],j)=>L.push(`   ${a} – ${b}: ${S.scales[j]||3}`))}
      if(it.dyn==="sintese")SYN.forEach((t,k)=>notes("syn-"+k,t));
    });
  });
  return L.join("\n");
}

function buildPDF(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"mm",format:"a4"});
  const W=210,H=297,M=18,CW=W-2*M,PT=0.3528;
  const BR=[63,12,12],RD=[206,21,21],OF=[251,239,224],PF=[246,214,204],SOFT=[130,90,85],CARD=[255,248,239];
  const clean=t=>String(t==null?"":t).replace(/[^\x09\x0A\x0D\x20-\xFF“”‘’–—…•€]/g,"").replace(/[ \t]+/g," ").trim();
  let y=M;
  const bg=c=>{doc.setFillColor(...c);doc.rect(0,0,W,H,"F")};
  const newPage=()=>{doc.addPage();bg(OF);y=M+4};
  const need=h=>{if(y+h>H-M-6)newPage()};
  const font=(size,style="normal",face="helvetica",color=BR)=>{doc.setFont(face,style);doc.setFontSize(size);doc.setTextColor(...color)};
  const text=(t,o={})=>{const {size=10,style="normal",face="helvetica",color=BR,x=M,w=CW,lh=1.35,after=1.5}=o;font(size,style,face,color);const step=size*PT*lh;doc.splitTextToSize(clean(t),w).forEach(l=>{need(step);doc.text(l,x,y+size*PT*.85);y+=step});y+=after};
  const notesOf=id=>(S.notes[id]||[]).map(n=>clean(n.t)).filter(Boolean);
  const answers=(arr,x=M,w=CW)=>{
    if(!arr.length){text("Sem registro.",{size:9,style:"italic",color:SOFT,x,w,after:2});return}
    arr.forEach(t=>{font(10);const lines=doc.splitTextToSize(t,w-8),step=10*PT*1.35,hh=lines.length*step+5;
      if(hh>H-2*M-10){text(t,{x:x+4,w:w-8});return}
      need(hh+2);doc.setFillColor(...PF);doc.roundedRect(x,y,w,hh,2.2,2.2,"F");font(10);
      lines.forEach((l,i)=>doc.text(l,x+4,y+3+i*step+10*PT*.85));y+=hh+2});
  };
  const pill=(label,x,yy,fill,color)=>{font(8,"bold","courier",color);const tw=doc.getTextWidth(label)+6;doc.setFillColor(...fill);doc.roundedRect(x,yy,tw,5.6,2.8,2.8,"F");doc.text(label,x+3,yy+3.9);return tw};
  const question=(it,id)=>{
    need(18);y+=2;
    const lab=it.n||it.tag||"";const pw=lab?pill(lab,M,y,it.tag?BR:RD,it.tag?OF:BR)+3:0;
    text(it.q,{size:11,style:"bold",x:M+pw,w:CW-pw,after:1});
    if(it.cols)it.cols.forEach((c,k)=>{need(10);text(c.toUpperCase(),{size:8.5,style:"bold",face:"courier",color:SOFT,after:1});answers(notesOf(id+"-"+k))});
    else if(!it.noNotes)answers(notesOf(id));
    y+=2;
  };
  const NAME={star:"Principais",y:"Escolhidos",n:"Rejeitados"};
  const chips=(gid,states)=>{const g=S.chips[gid]||{};let any=false;
    ["star","y","n"].forEach(st=>{const o=Object.keys(g).filter(k=>g[k]===st);if(!o.length)return;any=true;
      need(8);font(9,"bold","helvetica",st==="n"?SOFT:BR);doc.text(NAME[st],M,y+3);const lw=24;
      text(o.join("  ·  "),{size:10,x:M+lw,w:CW-lw,color:st==="n"?SOFT:BR,after:1.5})});
    if(!any)text("Sem marcações.",{size:9,style:"italic",color:SOFT,after:2});
  };
  const dynHead=(t,n)=>{need(16);y+=3;doc.setDrawColor(...RD);doc.setLineWidth(.6);doc.line(M,y,M+14,y);y+=4;
    const pw=n?pill(n,M,y,RD,BR)+3:0;text(t,{size:15,face:"times",x:M+pw,w:CW-pw,lh:1.15,after:2})};
  const grpHead=t=>{need(10);text(t,{size:9.5,style:"bold",face:"courier",after:1})};
  const group=g=>{if(g.label)grpHead(g.label);chips(g.id,g.states);if(g.after)question({q:g.after.q,cols:g.after.cols},g.after.id)};

  /* capa */
  bg(RD);
  try{doc.addImage(LOGO64,"PNG",M,M+2,74,13)}catch(e){}
  font(10,"bold","courier");doc.text("Imersão de marca · 2 horas",W-M,M+9,{align:"right"});
  y=78;text("Brazos",{size:64,face:"times",lh:1,after:0});
  text("Construindo uma nova fase.",{size:34,face:"times",style:"italic",lh:1.05,after:8});
  text("Naming  ·  Estratégia e posicionamento  ·  Identidade visual",{size:10,style:"bold",face:"courier",after:6});
  text("Uma imersão para compreender o momento do negócio, investigar suas vantagens competitivas, explorar o universo emocional do público e definir os direcionamentos estratégicos e criativos para a construção de uma nova marca.",{size:11,w:CW*.8,after:10});
  doc.setFillColor(...BR);const ay=y,ah=STEPS.length*9+8;doc.roundedRect(M,ay,CW,ah,5,5,"F");
  STEPS.forEach((s,i)=>{const yy=ay+9+i*9;font(10,"normal","helvetica",OF);doc.text(s.n,M+7,yy);doc.text(s.name,M+18,yy);doc.text(s.min+" min",W-M-7,yy,{align:"right"})});
  const d=new Date();font(9,"bold");doc.text("Registros de "+d.toLocaleDateString("pt-BR",{day:"2-digit",month:"long",year:"numeric"})+" · Estúdio FLAMMA®",M,H-M);

  /* etapas */
  STEPS.forEach(s=>{
    newPage();
    pill("Etapa "+s.n+"  ·  "+s.min+" min",M,y,BR,OF);y+=10;
    text(s.name.toUpperCase(),{size:9,style:"bold",face:"courier",color:SOFT,after:2});
    text(s.title,{size:26,face:"times",lh:1.08,after:3});
    s.lead.forEach(p=>text(p,{size:10.5,color:SOFT,after:2}));
    if(s.pillars)text(s.pillars.join("  +  "),{size:14,face:"times",style:"italic",after:2});
    y+=4;
    s.items.forEach(it=>{
      if(!it.dyn)return question(it,"q"+(it.id||it.n));
      if(it.dyn==="espectro"){dynHead("Espectro de personalidade");
        SPEC.forEach(([a,b],j)=>{need(11);const v=S.scales[j]||3,x0=M+40,x1=M+CW-40;
          font(10,"bold");doc.text(a,M,y+4);doc.text(b,M+CW,y+4,{align:"right"});
          doc.setDrawColor(...BR);doc.setLineWidth(.3);doc.line(x0,y+3,x1,y+3);
          for(let k=1;k<=5;k++){const cx=x0+(x1-x0)*(k-1)/4;if(k===v){doc.setFillColor(...RD);doc.circle(cx,y+3,2.4,"F")}else{doc.setFillColor(...OF);doc.circle(cx,y+3,1.2,"FD")}}
          y+=10});y+=2;return}
      if(it.dyn==="sintese"){SYN.forEach((t,k)=>{need(16);text(t,{size:11,style:"bold",after:1.5});answers(notesOf("syn-"+k));y+=2});return}
      const D=DYN[it.dyn];dynHead(D.title,D.n);
      D.groups.forEach(group);
      if(D.refs){grpHead("Marcas admiradas pela identidade visual e marcas rejeitadas");let anyR=false;
        Object.keys(S.refs).sort().forEach(k=>{const v=S.refs[k];if(!v||(!v.i&&!clean(v.n)&&!clean(v.w)))return;anyR=true;
          need(34);const top=y;if(v.i){try{doc.addImage(v.i,"JPEG",M,y,40,30)}catch(e){}}
          const x=M+(v.i?46:0),w=CW-(v.i?46:0);
          text(k.startsWith("neg")?"REJEITAMOS":"ADMIRAMOS",{size:8,style:"bold",face:"courier",color:SOFT,x,w,after:.5});
          text(v.n||"Sem nome",{size:12,style:"bold",x,w,after:1});text(v.w||"",{size:10,x,w,after:1});
          y=Math.max(y,top+(v.i?32:0))+2});
        if(!anyR)text("Sem registro.",{size:9,style:"italic",color:SOFT,after:2})}
      if(D.msgs){grpHead("Uma mensagem, diferentes personalidades");const g=S.chips.msg||{};let anyM=false;
        MSGS.forEach(([k,t])=>{const s=g[k];if(!s)return;anyM=true;need(12);
          text((s==="y"?"Mais representa · ":"Jamais usaríamos · ")+k,{size:8.5,style:"bold",color:s==="y"?BR:SOFT,after:.5});
          text("“"+t+"”",{size:13,face:"times",style:"italic",color:s==="y"?BR:SOFT,after:2})});
        if(!anyM)text("Sem marcações.",{size:9,style:"italic",color:SOFT,after:2})}
      if(D.tail)group(D.tail);
      if(D.after)question({q:D.after.q,cols:D.after.cols},D.after.id);
      y+=2;
    });
  });

  /* encerramento */
  doc.addPage();bg(RD);y=96;
  text("Uma nova fase",{size:52,face:"times",lh:1,after:0});text("começa aqui.",{size:52,face:"times",style:"italic",lh:1,after:8});
  text("Mais do que construir uma marca que o mercado precise contratar, queremos construir uma marca que o mercado deseje contratar e tenha orgulho de dizer que utiliza.",{size:13,w:CW*.82});
  try{doc.addImage(LOGO64,"PNG",M,H-M-11,52,9.1)}catch(e){}

  const n=doc.getNumberOfPages();
  for(let i=2;i<n;i++){doc.setPage(i);font(8,"normal","helvetica",SOFT);doc.text("Estúdio FLAMMA® · Imersão de marca Brazos",M,H-9);doc.text(String(i)+" / "+n,W-M,H-9,{align:"right"})}
  return doc.output("blob");
}
let DL=null;
(async()=>{try{if(window.claude&&window.claude.use)DL=await window.claude.use("downloads")}catch(e){DL=null}
  if(!window.jspdf){$("#pdfBtn").hidden=true;$("#copyBtn").hidden=false}})();
const plainSave=(blob,name)=>{const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)};
$("#pdfBtn").addEventListener("click",async()=>{
  const b=$("#pdfBtn");if(!window.jspdf)return toast("O gerador de PDF não carregou. Confira a conexão e recarregue a página.");
  b.disabled=true;b.textContent="Gerando PDF…";
  try{const blob=buildPDF();const d=new Date().toISOString().slice(0,10);const name=`imersao-brazos-flamma-${d}.pdf`;if(DL)await DL.save({filename:name,data:blob});else plainSave(blob,name);toast("PDF salvo.")}
  catch(e){const c=e&&e.code;toast(c==="declined"?"Download cancelado.":c==="rate_limited"?"Já existe um download aberto. Tente de novo em instantes.":"Não deu para salvar o PDF. Use Copiar registros como alternativa.");if(c!=="declined"&&c!=="rate_limited")$("#copyBtn").hidden=false;console.error(e)}
  finally{b.disabled=false;b.textContent="Salvar imersão em PDF"}
});

$("#clearBtn").addEventListener("click",()=>{$("#confirm").classList.add("show");$("#clearBtn").hidden=true});
$("#clearNo").addEventListener("click",()=>{$("#confirm").classList.remove("show");$("#clearBtn").hidden=false});
$("#clearYes").addEventListener("click",()=>{try{localStorage.removeItem(KEY)}catch(e){}location.reload()});
}
